; PreyHFR 1.0.5 configuration
; The ASI reads this file from its own directory on every game launch. Invalid
; or unknown entries keep the plugin inert and are reported in PreyHFR.log.

[patch]
enabled = true
; "desktop" detects the current primary monitor's refresh rate. 0 disables the
; internal limiter. Otherwise use any whole rate from 30 to 1000.
; Formal release validation begins at 120 Hz. Lower rates are accepted for
; diagnosis but remain outside the supported matrix.
presentation_fps = desktop
; The retail 16 ms clock (62.5 Hz) is the only supported simulation rate.
simulation_hz = native

[interpolation]
; This umbrella establishes the release defaults. A layer below can still be
; switched off independently for diagnosis.
enabled = true
camera = true
viewmodel = true
viewmodel_animation = true
world = true
world_animation = true
; Advances renderer-only particle and material time along the interpolated
; camera timeline. Gameplay FX spawning and simulation time remain unchanged.
effects = true
mouse = true
world_max_distance = 128
world_max_angle = 90

[compatibility]
; These cumulative switches select the post-RC1 cadence fixes. Keep all three
; enabled for the default RC4+ behavior. To bisect a compatibility issue:
;   RC3: overdue_snapshot_fallback = false
;   RC2: also set multi_tic_entity_alignment = false
;   RC1: also set continuous_snapshot_timing = false
continuous_snapshot_timing = true
multi_tic_entity_alignment = true
overdue_snapshot_fallback = true
; Keeps one completed native tic buffered so camera, weapon, world poses, and
; animations always have authoritative endpoints. This can hide irregular
; producer delivery, but adds one native tic of positional presentation delay.
; The stabilized game clock does not normally need it, so it is opt-in.
buffered_two_tic_interpolation = false

[diagnostics]
; Adds lower-volume camera/view counters to the periodic presentation log.
view_log = false
; Emits one structured interp_trace record per gameplay presentation. Enable
; this only while reproducing an interpolation problem; the log grows quickly.
interpolation_trace = false
; Emergency presentation-only timeline reset. Accepted values are F1 through
; F24 or none. This never changes simulation or save state.
timeline_reset_key = F10

[display]
; Borderless always selects the primary desktop's native resolution.
borderless = true
; Accepted values are game, windowed, and exclusive. Borderless implies
; windowed and cannot be combined with exclusive.
mode = game
; Accepted values are game, on, and off. Variable-refresh engagement remains
; driver-controlled; G-SYNC does not require V-Sync below the refresh ceiling.
vsync = game
; Accepted values are game, desktop, and WIDTHxHEIGHT. Desktop also enables
; borderless mode.
resolution = desktop
